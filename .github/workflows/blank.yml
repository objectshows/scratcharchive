name: Run Python Script

on:
  push:
    branches: [ main ]          # Triggers automatically when pushing to main
  workflow_dispatch:            # Allows you to trigger the script manually from GitHub UI

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Pulls your repository files onto the runner

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Specify your preferred Python version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Python Script
        run: python scratchcrawler.py    # Replace with your actual script filename
